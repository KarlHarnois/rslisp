[package]
name = "rslisp"
version = "0.2.13"
edition = "2024"
description = "A minimal Lisp that compiles to Rust (placeholder name)"
license = "MIT"
publish = false

[workspace]
members = ["expand", "xtask"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rslisp-expand = { path = "expand" }
serde_json = "1"
similar = "2.7"

[dev-dependencies]
insta = { version = "1", features = ["glob"] }

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
