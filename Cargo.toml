[package]
name = "rslisp"
version = "0.7.9"
edition = "2024"
description = "A minimal Lisp that compiles to Rust (placeholder name)"
license = "MIT"
publish = false

[workspace]
members = ["expand", "xtask"]

[workspace.dependencies]
rustc-hash = "2.1"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5.2"
rslisp-expand = { path = "expand" }
rustc-hash = { workspace = true }
rustyline = { version = "19.0.0", default-features = false, features = ["buffer-redux", "custom-bindings", "with-file-history"] }
serde_json = "1"
similar = "2.7"

[build-dependencies]
rslisp-expand = { path = "expand" }

[dev-dependencies]
insta = { version = "1", features = ["glob"] }

[features]
counters = []

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
