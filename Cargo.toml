[package]
name = "rslisp"
version = "0.6.0"
edition = "2024"
description = "A minimal Lisp that compiles to Rust (placeholder name)"
license = "MIT"
publish = false

[workspace]
members = ["expand", "xtask"]

[workspace.dependencies]
rustc-hash = "2.1"

[dependencies]
anstream = "1.0.0"
clap = { version = "4.6", features = ["derive"] }
rslisp-expand = { path = "expand" }
rustc-hash = { workspace = true }
serde_json = "1"
similar = "2.7"

[build-dependencies]
rslisp-expand = { path = "expand" }

[dev-dependencies]
insta = { version = "1", features = ["glob"] }

[features]
counters = []

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
