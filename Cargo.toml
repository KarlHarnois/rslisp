[package]
name = "rslisp"
version = "0.1.0"
edition = "2024"
description = "A minimal Lisp that compiles to Rust (placeholder name)"
license = "MIT"
publish = false

[workspace]
members = ["xtask"]

[dependencies]
annotate-snippets = "0.12"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
similar = "2.7"
stacker = "0.1"
unicode-ident = "1"

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
