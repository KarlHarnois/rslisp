name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CACHIX_CACHE: rslisp
  BASELINE: bench-baseline
  NOTES: refs/notes/bench
  ACCEPTED_TAG: bench-baseline
  SAVE_BUILD_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: check
          save-build-cache: ${{ env.SAVE_BUILD_CACHE }}
      - name: Format
        run: nix develop .#ci -c cargo fmt --all --check
      - name: Lint
        run: nix develop .#ci -c cargo clippy --workspace --all-targets -- -D warnings

  coverage-shard:
    name: coverage (${{ matrix.shard }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        shard: [saved-prelude-expand, saved-prelude-check, saved-prelude-emit, saved-prelude-run, check-and-emit, run, rest]
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: coverage
          save-build-cache: ${{ env.SAVE_BUILD_CACHE == 'true' && matrix.shard == 'rest' }}
      - name: Test
        run: nix develop .#ci -c cargo xtask coverage shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.shard }}
          path: target/coverage/shards
          if-no-files-found: error
          retention-days: 1

  emitted-lints:
    name: emitted lints
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: coverage
      - name: Lint the emitted Rust
        run: nix develop .#ci -c cargo xtask coverage emitted-lints

  # A skipped required check counts as passing, so this job runs after a failed need and fails itself.
  cargo-gate:
    name: cargo (ubuntu-latest)
    needs: [lint, coverage-shard, emitted-lints]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse a failed need
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: target/coverage/shards
          merge-multiple: true
      - name: Check coverage
        run: nix develop .#ci -c cargo xtask coverage gate

  cargo-macos:
    name: cargo (macos-latest)
    if: github.event_name == 'push'
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          build-cache: test
          save-build-cache: ${{ env.SAVE_BUILD_CACHE }}
      - name: Test
        run: nix develop .#ci -c cargo test --workspace

  flake:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 30 || 15 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - if: runner.os == 'macOS'
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ runner.os == 'macOS' }}
      - name: Check flake
        run: nix flake check

  commit-builds:
    name: commit builds (${{ matrix.os }})
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/dev-shell
        with:
          build-cache: check
      - name: Check each commit of the pull request
        shell: bash
        env:
          CARGO_INCREMENTAL: 1
        run: |
          for commit in $(git rev-list --reverse HEAD^1..HEAD^2); do
            git checkout --quiet "$commit"
            nix develop .#ci -c cargo check --workspace --all-targets ||
              { echo "::error::$commit does not build"; exit 1; }
          done

  bench:
    name: front-end instruction counts
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      REPORT: target/bench/report.md
      REPORT_MARKER: "<!-- front-end-instruction-counts -->"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the commit the pull request merges into
        id: base
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - name: Fetch the history and the accepted baseline
        shell: bash
        run: |
          git fetch --no-tags origin "+$NOTES:$NOTES" || echo "::notice::No history fetched, so the job measures instead."
          git fetch --no-tags --depth=1 origin "+refs/tags/$ACCEPTED_TAG:refs/tags/$ACCEPTED_TAG" || echo "::notice::No accepted baseline fetched."
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-${{ hashFiles('xtask/src/bench/compiler.rs') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-${{ hashFiles('xtask/src/bench/compiler.rs') }}-
            ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-
      - name: Recall the base branch from the history
        id: recall-base
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          if nix develop .#ci -c cargo xtask bench recall --notes-ref "$NOTES" "$BASE_SHA" --save target/bench/baseline.tsv; then
            echo "recalled=true" >> "$GITHUB_OUTPUT"
          else
            echo "recalled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.recall-base.outputs.recalled == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ steps.base.outputs.sha }}
          path: ${{ env.BASELINE }}
      - name: Measure the base branch
        if: steps.recall-base.outputs.recalled == 'false'
        run: nix develop .#ci -c cargo xtask bench measure --workspace "$BASELINE" --save target/bench/baseline.tsv
      - name: Measure the pull request
        id: measure
        run: nix develop .#ci -c cargo xtask bench measure --save target/bench/candidate.tsv
      - name: Upload the pull request's profiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: callgrind-profiles
          path: target/bench/**/*.callgrind
          if-no-files-found: error
          retention-days: 7
      - name: Recall the accepted baseline from the history
        id: accepted
        shell: bash
        run: |
          if ! sha=$(git rev-parse -q --verify "refs/tags/$ACCEPTED_TAG^{commit}"); then
            echo "found=tag-missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if nix develop .#ci -c cargo xtask bench recall --notes-ref "$NOTES" "$sha" --save target/bench/accepted.tsv; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=note-missing" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the programs whose counter rises the pull request accepts
        id: trailers
        shell: bash
        run: |
          programs=$(git log --format='%(trailers:key=Counters-Accepted,valueonly)' HEAD^1..HEAD^2 | tr -s '[:space:]' ' ')
          echo "programs=${programs# }" >> "$GITHUB_OUTPUT"
      - name: Compare
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_RECALLED: ${{ steps.recall-base.outputs.recalled }}
          ACCEPTED_FOUND: ${{ steps.accepted.outputs.found }}
          ACCEPTED_SHA: ${{ steps.accepted.outputs.sha }}
          ACCEPTED_PROGRAMS: ${{ steps.trailers.outputs.programs }}
        run: |
          read -ra accepted <<< "$ACCEPTED_PROGRAMS"
          compare() {
            nix develop .#ci -c cargo xtask bench compare --length "$1" "$2" target/bench/candidate.tsv "${accepted[@]/#/--accepted=}"
          }
          full=$(compare full target/bench/baseline.tsv)
          brief=$(compare brief target/bench/baseline.tsv)
          if [ "$BASE_RECALLED" = true ]; then
            base_source="The base counts come from the history."
          else
            base_source="The base counts come from a new measurement."
          fi
          accepted_heading="### Since the accepted baseline"
          case "$ACCEPTED_FOUND" in
            true)
              accepted_versions="\`$ACCEPTED_TAG\` at ${ACCEPTED_SHA::7} against ${HEAD_SHA::7} merged into \`$BASE_REF\`."
              accepted_full=$(compare full target/bench/accepted.tsv)
              accepted_brief=$(compare brief target/bench/accepted.tsv)
              ;;
            tag-missing)
              accepted_versions="No commit carries the tag \`$ACCEPTED_TAG\`, so there is no accepted baseline to compare with."
              ;;
            *)
              accepted_versions="The history has no note of \`$ACCEPTED_TAG\` at ${ACCEPTED_SHA::7} measured by this method, so there is nothing to compare with."
              ;;
          esac
          run_summary="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          heading="## Front-end instruction counts"
          versions="\`$BASE_REF\` at ${BASE_SHA::7} against ${HEAD_SHA::7} merged into it. $base_source"
          printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s\n' \
            "$heading" "$versions" "$full" "$accepted_heading" "$accepted_versions" "${accepted_full:-}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n%s\n\n%s [Every stage](%s).\n\n%s\n\n%s\n\n%s\n\n%s\n' \
            "$REPORT_MARKER" "$heading" "$versions" "$run_summary" "$brief" \
            "$accepted_heading" "$accepted_versions" "${accepted_brief:-}" > "$REPORT"
      - name: Post the report on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
          EDITS: repos/${{ github.repository }}/issues/comments
        run: |
          ids=$(gh api --paginate "$COMMENTS" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$REPORT_MARKER\"))) | .id")
          existing=${ids%%$'\n'*}
          if [ -n "$existing" ]; then
            gh api --method PATCH "$EDITS/$existing" -F body=@"$REPORT" --silent
          else
            gh api --method POST "$COMMENTS" -F body=@"$REPORT" --silent
          fi
      - name: Check allocation growth
        shell: bash
        env:
          ACCEPTED_PROGRAMS: ${{ steps.trailers.outputs.programs }}
        run: |
          read -ra accepted <<< "$ACCEPTED_PROGRAMS"
          nix develop .#ci -c cargo xtask bench check-counters target/bench/baseline.tsv target/bench/candidate.tsv "${accepted[@]/#/--accepted=}"
      - name: Save cargo cache
        if: ${{ !cancelled() && steps.measure.outcome != 'skipped' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-${{ hashFiles('xtask/src/bench/compiler.rs') }}-${{ hashFiles('Cargo.lock') }}

  bench-history:
    name: front-end instruction history
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: front-end-instruction-history
      cancel-in-progress: false
    env:
      HEAD_RESULTS: target/bench/head.tsv
      ACCEPTED_RESULTS: target/bench/accepted.tsv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-${{ hashFiles('xtask/src/bench/compiler.rs') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-${{ hashFiles('xtask/src/bench/compiler.rs') }}-
            ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-
      - name: Fetch the history and the accepted baseline
        shell: bash
        run: |
          fetch_when_present() {
            local status=0
            git ls-remote --exit-code origin "$1" > /dev/null || status=$?
            case "$status" in
              0) git fetch --no-tags "${@:2}" origin "+$1:$1" ;;
              2) echo "::notice::Origin has no $1." ;;
              *) exit "$status" ;;
            esac
          }
          fetch_when_present "$NOTES"
          fetch_when_present "refs/tags/$ACCEPTED_TAG" --depth=1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record the counts of this commit
        id: measure
        run: |
          nix develop .#ci -c cargo xtask bench measure --save "$HEAD_RESULTS"
          git notes --ref="$NOTES" add -f -F "$HEAD_RESULTS" HEAD
      - name: Recall the accepted baseline
        id: accepted
        shell: bash
        run: |
          if ! sha=$(git rev-parse -q --verify "refs/tags/$ACCEPTED_TAG^{commit}"); then
            echo "No tag \`$ACCEPTED_TAG\` names an accepted baseline."
            echo "measure=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if nix develop .#ci -c cargo xtask bench recall --notes-ref "$NOTES" "$sha" --save target/bench/accepted-recalled.tsv; then
            echo "measure=false" >> "$GITHUB_OUTPUT"
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.accepted.outputs.measure == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ steps.accepted.outputs.sha }}
          path: ${{ env.BASELINE }}
      - name: Record the counts of the accepted baseline
        if: steps.accepted.outputs.measure == 'true'
        env:
          ACCEPTED_SHA: ${{ steps.accepted.outputs.sha }}
        run: |
          nix develop .#ci -c cargo xtask bench measure --workspace "$BASELINE" --save "$ACCEPTED_RESULTS"
          git notes --ref="$NOTES" add -f -F "$ACCEPTED_RESULTS" "$ACCEPTED_SHA"
      - name: Push the notes
        shell: bash
        env:
          ACCEPTED_SHA: ${{ steps.accepted.outputs.sha }}
          ACCEPTED_MEASURED: ${{ steps.accepted.outputs.measure }}
        run: |
          if git push origin "$NOTES"; then
            exit 0
          fi
          git fetch origin "+$NOTES:$NOTES"
          git notes --ref="$NOTES" add -f -F "$HEAD_RESULTS" HEAD
          if [ "$ACCEPTED_MEASURED" = true ]; then
            git notes --ref="$NOTES" add -f -F "$ACCEPTED_RESULTS" "$ACCEPTED_SHA"
          fi
          git push origin "$NOTES"
      - name: Save cargo cache
        if: ${{ !cancelled() && steps.measure.outcome != 'skipped' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-${{ hashFiles('xtask/src/bench/compiler.rs') }}-${{ hashFiles('Cargo.lock') }}
