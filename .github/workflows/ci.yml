name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CACHIX_CACHE: rslisp

jobs:
  cargo:
    name: cargo (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tests: cargo xtask coverage
            build: coverage
          - os: macos-latest
            tests: cargo test --workspace
            build: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 25 || 15 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - if: runner.os == 'macOS'
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.build }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.build }}-${{ hashFiles('flake.lock') }}-
      - name: Format
        if: runner.os == 'Linux'
        run: nix develop .#ci -c cargo fmt --all --check
      - name: Lint
        if: runner.os == 'Linux'
        run: nix develop .#ci -c cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        id: tests
        run: nix develop .#ci -c ${{ matrix.tests }}
      - name: Save cargo cache
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.build }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}

  flake:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 30 || 15 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether this run builds the flake
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$RUNNER_OS" = macOS ] && git diff --quiet HEAD^1 HEAD -- flake.nix flake.lock Cargo.lock '*Cargo.toml' .cargo; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.build == 'true' && runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - if: steps.scope.outputs.build == 'true' && runner.os == 'macOS'
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - if: steps.scope.outputs.build == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check flake
        if: steps.scope.outputs.build == 'true'
        run: nix flake check

  bench:
    name: front-end instruction counts
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      BASELINE: bench-baseline
      REPORT: target/bench/report.md
      REPORT_MARKER: "<!-- front-end-instruction-counts -->"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: ${{ env.BASELINE }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ${{ env.BASELINE }}/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-
      - name: Measure the base branch
        id: measure
        run: nix develop .#ci -c cargo xtask bench measure --workspace "$BASELINE" --save target/bench/baseline.tsv
      - name: Measure the pull request
        run: nix develop .#ci -c cargo xtask bench measure --save target/bench/candidate.tsv
      - name: Compare
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          compare() {
            nix develop .#ci -c cargo xtask bench compare --length "$1" target/bench/baseline.tsv target/bench/candidate.tsv
          }
          full=$(compare full)
          brief=$(compare brief)
          run_summary="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          heading="## Front-end instruction counts"
          versions="\`$BASE_REF\` at ${BASE_SHA::7} against ${HEAD_SHA::7} merged into it."
          printf '%s\n\n%s\n\n%s\n' "$heading" "$versions" "$full" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n%s\n\n%s [Every stage](%s).\n\n%s\n' \
            "$REPORT_MARKER" "$heading" "$versions" "$run_summary" "$brief" > "$REPORT"
      - name: Post the report on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
          EDITS: repos/${{ github.repository }}/issues/comments
        run: |
          existing=$(gh api --paginate "$COMMENTS" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$REPORT_MARKER\"))) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "$EDITS/$existing" -F body=@"$REPORT" --silent
          else
            gh api --method POST "$COMMENTS" -F body=@"$REPORT" --silent
          fi
      - name: Save cargo cache
        if: ${{ !cancelled() && steps.measure.outcome != 'skipped' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ${{ env.BASELINE }}/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
