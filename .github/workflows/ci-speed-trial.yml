name: CI speed trial

on:
  push:
    branches: [research-ci-speed]

permissions:
  contents: read

env:
  CACHIX_CACHE: rslisp

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-${{ hashFiles('flake.lock') }}-
      - name: Format
        run: nix develop .#ci -c cargo fmt --all --check
      - name: Lint
        run: nix develop .#ci -c cargo clippy --workspace --all-targets -- -D warnings

  shard:
    name: shard (${{ matrix.variant }}, ${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        variant: [current, optimized]
        shard:
          - name: run
            targets: --test stages -- --exact run_fixtures corpus_fixtures
          - name: saved-run
            targets: --test stages -- --exact saved_prelude_run_fixtures saved_prelude_corpus_fixtures
          - name: check
            targets: --test stages -- --exact check_fixtures saved_prelude_check_fixtures
          - name: expand
            targets: --test stages -- --exact expand_fixtures saved_prelude_expand_fixtures
          - name: stages-rest
            targets: --test stages -- --skip run_fixtures --skip corpus_fixtures --skip check_fixtures --skip expand_fixtures
          - name: units
            targets: --workspace --lib --bins --test cli --test diagnostic_codes --test diagnostic_snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-${{ hashFiles('flake.lock') }}-
      - name: Optimize
        if: matrix.variant == 'optimized'
        run: |
          echo "CARGO_PROFILE_DEV_OPT_LEVEL=1" >> "$GITHUB_ENV"
          sed -i '/^\[profile.dev.package."\*"\]/a opt-level = 2' Cargo.toml
      - name: Load the dev shell
        run: nix develop .#ci -c true
      - name: Test with coverage
        run: nix develop .#ci -c bash .github/trial/shard.sh "${{ matrix.shard.targets }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov-${{ matrix.variant }}-${{ matrix.shard.name }}
          path: target/shard.info
          retention-days: 3

  gate:
    name: gate (${{ matrix.variant }})
    needs: shard
    strategy:
      fail-fast: false
      matrix:
        variant: [current, optimized]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-${{ hashFiles('xtask/src/bench/compiler.rs') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-${{ hashFiles('flake.lock') }}-
      - uses: actions/download-artifact@v4
        with:
          pattern: lcov-${{ matrix.variant }}-*
          path: target/shards
      - name: Merge the shards
        run: cat target/shards/*/shard.info > target/merged.info
      - name: Judge coverage, CRAP, the badge and the emitted lints
        env:
          TRIAL_MERGED_LCOV: target/merged.info
        run: nix develop .#ci -c cargo xtask coverage
