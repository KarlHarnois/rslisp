name: Dev shell
description: Install Nix, trust the project's Cachix, and restore the Rust build cache.

inputs:
  cachix-auth-token:
    description: Pushes built store paths to Cachix when set.
    default: ""
  build-cache:
    description: The name of the Rust build cache, shared by every job that builds the same way.
    required: true
  save-build-cache:
    description: Saves the Rust build cache after the job.
    default: "false"

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - if: runner.os == 'macOS'
      uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: ${{ env.CACHIX_CACHE }}
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: ${{ runner.os == 'macOS' }}
    # The build cache's key holds the compiler's version, so the cache action must find rustc and cargo.
    - name: Expose the dev shell's Rust tools
      shell: bash
      run: nix develop .#ci -c bash -c 'dirname "$(command -v cargo)"; dirname "$(command -v rustc)"' >> "$GITHUB_PATH"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.build-cache }}
        save-if: ${{ inputs.save-build-cache }}
